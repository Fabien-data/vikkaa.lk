# /etc/nginx/sites-available/vikkaa.conf  (symlink into sites-enabled)
# Plain HTTP on purpose: `certbot --nginx -d vikkaa.lk -d www.vikkaa.lk -d app.vikkaa.lk` adds HTTPS and the redirects.

server {
    listen 80;
    server_name www.vikkaa.lk;
    return 301 https://vikkaa.lk$request_uri;
}

server {
    listen 80;
    server_name vikkaa.lk app.vikkaa.lk;

    client_max_body_size 50M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Listing photos straight from disk.
    location /media/ {
        alias /srv/vikkaa/storage/public/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        # Overwrite (not append) so a client cannot spoof the IP used for rate limits and signing records.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
