# Production on the shared VPS. The image is built on the dev machine and shipped (see deploy/deploy.sh);
# nothing is compiled on the server. Run from /srv/vikkaa/app:
#   sudo docker compose -f deploy/docker-compose.prod.yml up -d --no-build web db
name: vikkaa

services:
  web:
    image: vikkaa-web:latest
    env_file: ../.env.production
    environment:
      STORAGE_DIR: /data/storage
    ports:
      # 3000 is taken by another site on this server.
      - "127.0.0.1:3020:3000"
    volumes:
      - /srv/vikkaa/storage:/data/storage
    depends_on: [db]
    restart: unless-stopped

  db:
    image: postgres:17
    env_file: ../.env.production
    ports:
      # Localhost only: migrations, seed and staff accounts run from the dev machine through an SSH tunnel (deploy/remote-db.sh).
      - "127.0.0.1:5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
