# Production on the VPS. Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml up -d web db
services:
  web:
    build: { context: .., dockerfile: deploy/Dockerfile, target: runner }
    env_file: ../.env.production
    environment:
      STORAGE_DIR: /data/storage
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /srv/vikkaa/storage:/data/storage
    depends_on: [db]
    restart: unless-stopped

  db:
    image: postgres:17
    env_file: ../.env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  # One-off jobs: docker compose -f deploy/docker-compose.prod.yml --profile tools run --rm tools pnpm db:migrate
  tools:
    build: { context: .., dockerfile: deploy/Dockerfile, target: builder }
    env_file: ../.env.production
    environment:
      STORAGE_DIR: /data/storage
    volumes:
      - /srv/vikkaa/storage:/data/storage
    depends_on: [db]
    profiles: [tools]

volumes:
  pgdata:
